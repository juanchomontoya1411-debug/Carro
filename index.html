
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VÉRTICE | Toyota Supra MK4</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b11;color:white;font-family:Arial,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
header{position:fixed;top:0;left:0;padding:22px;z-index:3;
font-size:22px;font-weight:bold;letter-spacing:5px;pointer-events:none}
header span{color:#d9ff43}
.panel{position:fixed;right:18px;top:82px;width:245px;padding:17px;
background:#101722ed;border:1px solid #394655;border-radius:16px;z-index:2}
.eyebrow{font-size:10px;color:#d9ff43;letter-spacing:2px}
h1{font-size:32px;line-height:1;margin:12px 0}
p{font-size:12px;line-height:1.6;color:#aab5c5}
h2{font-size:11px;letter-spacing:2px;margin-top:20px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.color{width:29px;height:29px;border-radius:50%;border:2px solid white;cursor:pointer}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{background:#202a36;color:white;border:1px solid #526174;
padding:10px 5px;border-radius:8px;font-size:11px;cursor:pointer}
button:hover{border-color:#d9ff43}
input{width:100%;accent-color:#d9ff43}
#status{font-size:10px;color:#d9ff43}
.hint{position:fixed;bottom:18px;left:18px;font-size:10px;
letter-spacing:1px;color:#aab5c5;z-index:1}
@media(max-width:600px){
 header{padding:15px;font-size:18px}
 .panel{top:auto;bottom:45px;right:9px;width:185px;padding:12px;
 max-height:65vh;overflow:auto}
 h1{font-size:24px;margin:8px 0}
 p{font-size:10px;margin:7px 0}
 h2{margin-top:12px}
 .color{width:24px;height:24px}
 button{padding:9px 3px;font-size:10px}
 .hint{top:52px;bottom:auto;font-size:8px}
}
</style>
</head>
<body>
<header>VÉRTICE<span>.</span></header>
<canvas id="scene"></canvas>
<div class="hint">ARRASTRA PARA GIRAR · PINZA PARA ZOOM</div>

<div class="panel">
 <div class="eyebrow">JAPANESE LEGEND · A80</div>
 <h1>SUPRA<br>MK4.</h1>
 <p>El legendario deportivo japonés de los años 90, recreado en 3D.</p>
 <div id="status">● MODELO 3D ACTIVO</div>

 <h2>COLOR</h2>
 <div class="colors">
  <button class="color" style="background:#b51e2b" onclick="paint('#b51e2b')"></button>
  <button class="color" style="background:#101216" onclick="paint('#101216')"></button>
  <button class="color" style="background:#e7e7e5" onclick="paint('#e7e7e5')"></button>
  <button class="color" style="background:#164aab" onclick="paint('#164aab')"></button>
  <button class="color" style="background:#d9ff43" onclick="paint('#d9ff43')"></button>
  <button class="color" style="background:#f08b16" onclick="paint('#f08b16')"></button>
 </div>

 <h2>CONTROLES</h2>
 <div class="buttons">
  <button onclick="toggleLights()">Faros</button>
  <button onclick="toggleSpin()">Giro automático</button>
  <button onclick="resetView()">Vista inicial</button>
  <button onclick="rearView()">Vista trasera</button>
  <button onclick="toggleWing()">Alerón</button>
  <button onclick="toggleFloor()">Suelo espejo</button>
 </div>

 <h2>ILUMINACIÓN</h2>
 <input type="range" min=".6" max="2.4" step=".1" value="1.3"
 oninput="setBrightness(this.value)">
 <p>Modelo conceptual inspirado en el Toyota Supra A80.</p>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color('#090e17');
scene.fog=new THREE.Fog('#090e17',18,38);

const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);
camera.position.set(6,3.3,7);

const renderer=new THREE.WebGLRenderer({
 canvas:document.querySelector('#scene'),antialias:true
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.3;
renderer.shadowMap.enabled=true;

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,.85,0);
controls.enableDamping=true;
controls.minDistance=3.8;
controls.maxDistance=14;
controls.maxPolarAngle=Math.PI/2.02;

scene.add(new THREE.HemisphereLight(0xdceaff,0x25222a,2.1));

const key=new THREE.DirectionalLight(0xffffff,4);
key.position.set(4,8,5);
key.castShadow=true;
scene.add(key);

const blueLight=new THREE.PointLight(0x567fff,40,18);
blueLight.position.set(-4,3,-4);
scene.add(blueLight);

const floorMat=new THREE.MeshStandardMaterial({
 color:0x171d26,metalness:.75,roughness:.25
});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),floorMat);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.05;
scene.add(floor);

const platform=new THREE.Mesh(
 new THREE.CylinderGeometry(3.8,3.8,.12,80),
 new THREE.MeshStandardMaterial({color:0x252d38,metalness:.7,roughness:.28})
);
platform.position.y=.01;
scene.add(platform);

const ring=new THREE.Mesh(
 new THREE.TorusGeometry(3.65,.018,8,120),
 new THREE.MeshBasicMaterial({color:0xd9ff43})
);
ring.rotation.x=Math.PI/2;
ring.position.y=.08;
scene.add(ring);

const car=new THREE.Group();
scene.add(car);

const paintMat=new THREE.MeshPhysicalMaterial({
 color:0xb51e2b,metalness:.65,roughness:.2,
 clearcoat:1,clearcoatRoughness:.12
});
const black=new THREE.MeshStandardMaterial({
 color:0x090b0f,metalness:.35,roughness:.3
});
const glass=new THREE.MeshPhysicalMaterial({
 color:0x101b29,metalness:.4,roughness:.12,clearcoat:1
});
const chrome=new THREE.MeshStandardMaterial({
 color:0xb9c5d3,metalness:.95,roughness:.18
});
const headMat=new THREE.MeshStandardMaterial({
 color:0xffffff,emissive:0xffffff,emissiveIntensity:0
});
const tailMat=new THREE.MeshStandardMaterial({
 color:0xff1028,emissive:0xff0018,emissiveIntensity:1.1
});

function part(geo,mat,x,y,z,parent=car){
 const m=new THREE.Mesh(geo,mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

// Base de la carrocería: morro largo y parte trasera ancha
part(new THREE.BoxGeometry(4.35,.48,1.86),paintMat,0,.65,0);
part(new THREE.BoxGeometry(1.35,.15,1.83),paintMat,1.36,.94,0);
part(new THREE.BoxGeometry(1.1,.17,1.84),paintMat,-1.48,.91,0);

// Formas redondeadas de los guardabarros
for(const x of [-1.32,1.32]){
 for(const z of [-.75,.75]){
  const arch=part(new THREE.TorusGeometry(.43,.095,12,40,Math.PI),paintMat,x,.48,z);
  arch.rotation.z=Math.PI;
  arch.rotation.x=Math.PI/2;
 }
}

// Capó ancho con líneas de estilo
part(new THREE.BoxGeometry(1.45,.095,1.65),paintMat,1.22,.985,0);
for(const z of [-.53,.53]){
 part(new THREE.BoxGeometry(1.05,.018,.018),chrome,1.23,1.04,z);
}

// Cabina curvada, techo y cristales
const cabinShape=new THREE.Shape();
cabinShape.moveTo(-1.05,1.0);
cabinShape.lineTo(-.84,1.42);
cabinShape.quadraticCurveTo(-.72,1.60,-.43,1.61);
cabinShape.lineTo(.20,1.61);
cabinShape.quadraticCurveTo(.48,1.59,.62,1.32);
cabinShape.lineTo(.76,1.03);
cabinShape.closePath();

const cabinGeo=new THREE.ExtrudeGeometry(cabinShape,{
 depth:1.37,bevelEnabled:true,bevelSegments:3,
 bevelSize:.035,bevelThickness:.025
});
cabinGeo.translate(0,0,-.685);
part(cabinGeo,glass,0,0,0);

// Techo rojo
part(new THREE.BoxGeometry(.65,.055,1.39),paintMat,-.13,1.62,0);

// Cristales laterales
for(const z of [-.699,.699]){
 const s=new THREE.Shape();
 s.moveTo(-.83,1.12);
 s.lineTo(-.69,1.43);
 s.lineTo(-.42,1.53);
 s.lineTo(.16,1.53);
 s.lineTo(.45,1.23);
 s.lineTo(.48,1.12);
 s.closePath();
 const win=new THREE.Mesh(new THREE.ShapeGeometry(s),glass);
 win.position.z=z;
 car.add(win);
 part(new THREE.BoxGeometry(.035,.42,.025),black,-.1,1.34,z);
}

// Espejos
for(const z of [-.82,.82]){
 part(new THREE.BoxGeometry(.19,.09,.12),black,.43,1.05,z);
}

// Frente: faros ovalados, parrilla e ingreso de aire
part(new THREE.BoxGeometry(.14,.23,1.86),paintMat,2.05,.62,0);
part(new THREE.BoxGeometry(.035,.19,.64),black,2.13,.63,0);
part(new THREE.BoxGeometry(.07,.10,1.50),black,2.13,.48,0);

const headlights=[];
for(const z of [-.61,.61]){
 const h=part(new THREE.BoxGeometry(.09,.10,.43),headMat,2.135,.78,z);
 headlights.push(h);
 part(new THREE.BoxGeometry(.08,.08,.27),black,2.14,.57,z);
}

// Intermitentes delanteros
for(const z of [-.78,.78]){
 part(new THREE.BoxGeometry(.05,.07,.15),
 new THREE.MeshBasicMaterial({color:0xffa21a}),2.13,.59,z);
}

// Ruedas deportivas de cinco radios
const wheels=[];
for(const x of [-1.32,1.32]){
 for(const z of [-.96,.96]){
  const tire=part(new THREE.CylinderGeometry(.39,.39,.25,48),black,x,.46,z);
  tire.rotation.x=Math.PI/2;
  wheels.push(tire);

  const rim=part(new THREE.CylinderGeometry(.29,.29,.26,32),chrome,x,.46,z*1.01);
  rim.rotation.x=Math.PI/2;
  const inner=part(new THREE.CylinderGeometry(.235,.235,.27,32),black,x,.46,z*1.015);
  inner.rotation.x=Math.PI/2;
  const hub=part(new THREE.CylinderGeometry(.075,.075,.28,24),chrome,x,.46,z*1.02);
  hub.rotation.x=Math.PI/2;

  for(let i=0;i<5;i++){
   const a=i*Math.PI*2/5;
   const spoke=part(new THREE.BoxGeometry(.065,.27,.035),chrome,x,.46,z*1.025);
   spoke.rotation.set(a,0,Math.PI/2);
  }
 }
}

// Faldones
for(const z of [-.86,.86]){
 part(new THREE.BoxGeometry(2.55,.10,.12),black,0,.38,z);
}

// Parte trasera y luces circulares dobles
part(new THREE.BoxGeometry(.12,.27,1.78),paintMat,-2.09,.68,0);
part(new THREE.BoxGeometry(.05,.12,1.58),black,-2.16,.80,0);

for(const z of [-.61,-.27,.27,.61]){
 const lamp=part(new THREE.CylinderGeometry(.095,.095,.035,32),tailMat,-2.19,.81,z);
 lamp.rotation.z=Math.PI/2;
 part(new THREE.CylinderGeometry(.055,.055,.04,32),black,-2.215,.81,z);
}

// Alerón clásico del MK4
const wing=new THREE.Group();
car.add(wing);
part(new THREE.BoxGeometry(.07,.26,.09),black,-1.72,1.04,-.62,wing);
part(new THREE.BoxGeometry(.07,.26,.09),black,-1.72,1.04,.62,wing);
part(new THREE.BoxGeometry(.40,.075,1.62),black,-1.83,1.19,0,wing);

// Escape
const exhaust=part(new THREE.CylinderGeometry(.075,.075,.23,24),chrome,-1.92,.43,-.69);
exhaust.rotation.x=Math.PI/2;

const lamp1=new THREE.SpotLight(0xffffff,0,12,Math.PI/7,.4,1.5);
lamp1.position.set(2.15,.75,.5);
lamp1.target.position.set(5,0,.5);
scene.add(lamp1,lamp1.target);

const lamp2=new THREE.SpotLight(0xffffff,0,12,Math.PI/7,.4,1.5);
lamp2.position.set(2.15,.75,-.5);
lamp2.target.position.set(5,0,-.5);
scene.add(lamp2,lamp2.target);

let spin=false,lights=false,wingOn=true;

window.paint=c=>{
 paintMat.color.set(c);
 document.querySelector('#status').textContent='● COLOR ACTUALIZADO';
};
window.toggleLights=()=>{
 lights=!lights;
 headMat.emissiveIntensity=lights?3:0;
 lamp1.intensity=lights?22:0;
 lamp2.intensity=lights?22:0;
 document.querySelector('#status').textContent=lights?'● FAROS ENCENDIDOS':'● FAROS APAGADOS';
};
window.toggleSpin=()=>{
 spin=!spin;
 document.querySelector('#status').textContent=spin?'● GIRO AUTOMÁTICO':'● GIRO MANUAL';
};
window.toggleWing=()=>{
 wingOn=!wingOn;
 wing.visible=wingOn;
};
window.toggleFloor=()=>{
 const shiny=floorMat.roughness>.3;
 floorMat.roughness=shiny?.15:.75;
 floorMat.metalness=shiny?.95:.2;
};
window.resetView=()=>{
 camera.position.set(6,3.3,7);
 controls.target.set(0,.85,0);
 car.rotation.y=0;
 controls.update();
};
window.rearView=()=>{
 camera.position.set(-6,2.8,-6);
 controls.target.set(0,.85,0);
 controls.update();
};
window.setBrightness=v=>{
 renderer.toneMappingExposure=Number(v);
 key.intensity=3*Number(v);
};

function animate(){
 requestAnimationFrame(animate);
 const dt=clock.getDelta();
 if(spin)car.rotation.y+=dt*.35;
 controls.update();
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
