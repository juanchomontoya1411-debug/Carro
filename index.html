
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VÉRTICE | Supra MK3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b11;color:white;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:absolute;top:0;left:0;padding:22px;z-index:3;
font-weight:bold;letter-spacing:5px;font-size:22px;pointer-events:none}
header span{color:#d9ff43}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.panel{position:absolute;right:20px;top:85px;width:255px;padding:18px;
background:rgba(13,20,30,.91);border:1px solid #424d5d;
border-radius:18px;z-index:2;backdrop-filter:blur(12px)}
.eyebrow{color:#d9ff43;font-size:10px;letter-spacing:2px}
h1{font-size:29px;line-height:1.05;margin:12px 0}
p{font-size:12px;color:#aab5c5;line-height:1.6}
h2{font-size:11px;letter-spacing:2px;margin-top:22px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.color{width:30px;height:30px;border:2px solid white;border-radius:50%;
cursor:pointer}
button{background:#202a36;border:1px solid #536174;color:white;
padding:11px 7px;border-radius:9px;font-size:12px;cursor:pointer}
button:active{border-color:#d9ff43}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input{width:100%;accent-color:#d9ff43}
#status{color:#d9ff43;font-size:10px}
.hint{position:absolute;left:22px;bottom:20px;z-index:1;
font-size:10px;letter-spacing:1px;color:#aab5c5}
@media(max-width:600px){
 header{padding:16px;font-size:18px}
 .panel{top:auto;bottom:55px;right:10px;width:185px;
 padding:12px;border-radius:15px;max-height:65vh;overflow-y:auto}
 h1{font-size:23px;margin:8px 0}
 p{font-size:11px;margin:8px 0}
 h2{margin-top:13px;font-size:10px}
 .color{width:25px;height:25px}
 button{padding:10px 5px;font-size:11px}
 .hint{top:55px;bottom:auto;left:15px;font-size:8px}
}
</style>
</head>
<body>
<header>VÉRTICE<span>.</span></header>
<canvas id="scene"></canvas>
<div class="hint">ARRASTRA PARA GIRAR · PINZA PARA ZOOM</div>

<div class="panel">
 <div class="eyebrow">JAPANESE CLASSIC · A70</div>
 <h1>SUPRA<br>MK3.</h1>
 <p>Un icono japonés de los años 80, reinterpretado en 3D.</p>
 <div id="status">● MODELO 3D LISTO</div>

 <h2>COLOR DE CARROCERÍA</h2>
 <div class="colors">
  <button class="color" style="background:#b82030" onclick="paint('#b82030')"></button>
  <button class="color" style="background:#171a20" onclick="paint('#171a20')"></button>
  <button class="color" style="background:#e6e7e8" onclick="paint('#e6e7e8')"></button>
  <button class="color" style="background:#163f9b" onclick="paint('#163f9b')"></button>
  <button class="color" style="background:#d9ff43" onclick="paint('#d9ff43')"></button>
 </div>

 <h2>EXPLORAR</h2>
 <div class="buttons">
  <button onclick="toggleLights()">Faros</button>
  <button onclick="toggleSpin()">Girar solo</button>
  <button onclick="rearView()">Vista trasera</button>
  <button onclick="resetView()">Vista inicial</button>
  <button onclick="toggleSpoiler()">Alerón</button>
  <button onclick="toggleFloor()">Suelo espejo</button>
 </div>

 <h2>ILUMINACIÓN</h2>
 <input type="range" min="0.5" max="2.5" step="0.1" value="1.3"
 oninput="setBrightness(this.value)">
 <p>Concepto 3D inspirado en el Toyota Supra A70. Arrastra el vehículo para inspeccionarlo.</p>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const canvas=document.querySelector('#scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color('#080d15');
scene.fog=new THREE.Fog('#080d15',17,36);

const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);
camera.position.set(6,3.4,7);

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
renderer.shadowMap.enabled=true;

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,.8,0);
controls.enableDamping=true;
controls.minDistance=4;
controls.maxDistance=13;
controls.maxPolarAngle=Math.PI/2.05;

scene.add(new THREE.HemisphereLight(0xdceaff,0x27232a,2.2));

const key=new THREE.DirectionalLight(0xffffff,3.5);
key.position.set(4,8,6);
key.castShadow=true;
scene.add(key);

const fill=new THREE.PointLight(0x4b76ff,45,18);
fill.position.set(-4,3,-4);
scene.add(fill);

const rim=new THREE.PointLight(0xff3548,28,12);
rim.position.set(-3,2,4);
scene.add(rim);

const floorMat=new THREE.MeshStandardMaterial({
 color:0x171c25,metalness:.8,roughness:.24
});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),floorMat);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.04;
scene.add(floor);

const stage=new THREE.Mesh(
 new THREE.CylinderGeometry(3.8,3.8,.12,80),
 new THREE.MeshStandardMaterial({color:0x242b35,metalness:.65,roughness:.3})
);
stage.position.y=.02;
scene.add(stage);

const ring=new THREE.Mesh(
 new THREE.TorusGeometry(3.65,.018,8,120),
 new THREE.MeshBasicMaterial({color:0xd9ff43})
);
ring.rotation.x=Math.PI/2;
ring.position.y=.09;
scene.add(ring);

const car=new THREE.Group();
scene.add(car);

const paintMat=new THREE.MeshPhysicalMaterial({
 color:0xb82030,metalness:.62,roughness:.23,
 clearcoat:1,clearcoatRoughness:.12
});
const black=new THREE.MeshStandardMaterial({
 color:0x080a0e,metalness:.35,roughness:.3
});
const glass=new THREE.MeshPhysicalMaterial({
 color:0x101b2a,metalness:.5,roughness:.14,
 clearcoat:1
});
const chrome=new THREE.MeshStandardMaterial({
 color:0xbac4d0,metalness:.95,roughness:.18
});
const headMat=new THREE.MeshStandardMaterial({
 color:0xffffff,emissive:0x789fff,emissiveIntensity:0
});
const tailMat=new THREE.MeshStandardMaterial({
 color:0xff132d,emissive:0xff0018,emissiveIntensity:.5
});

function part(geo,mat,x,y,z,parent=car){
 const m=new THREE.Mesh(geo,mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

// Carrocería lateral con silueta de coupé deportivo ochentero.
// El frente está hacia +X.
const shape=new THREE.Shape();
shape.moveTo(-2.05,.48);
shape.lineTo(-2.02,.91);
shape.lineTo(-1.65,1.03);
shape.lineTo(-1.15,1.08);
shape.lineTo(-.83,1.48);
shape.lineTo(-.48,1.62);
shape.lineTo(.34,1.62);
shape.lineTo(.68,1.16);
shape.lineTo(1.55,1.10);
shape.lineTo(2.02,.91);
shape.lineTo(2.08,.53);
shape.lineTo(1.72,.48);
shape.lineTo(-1.72,.48);
shape.closePath();

const bodyGeo=new THREE.ExtrudeGeometry(shape,{
 depth:1.78,bevelEnabled:true,bevelSegments:2,
 steps:1,bevelSize:.045,bevelThickness:.035
});
bodyGeo.translate(0,0,-.89);
part(bodyGeo,paintMat,0,0,0);

// Capó largo y plano
part(new THREE.BoxGeometry(1.3,.13,1.7),paintMat,1.28,.99,0);

// Parachoques delantero cuadrado
part(new THREE.BoxGeometry(.16,.25,1.88),paintMat,2.04,.61,0);
part(new THREE.BoxGeometry(.13,.10,1.86),black,2.13,.49,0);

// Parrilla frontal
part(new THREE.BoxGeometry(.035,.15,.64),black,2.132,.68,0);
part(new THREE.BoxGeometry(.04,.035,.72),chrome,2.15,.76,0);

// Faros escamoteables cerrados: tapas rectangulares sobre el capó
const headCovers=[];
for(const z of [-.59,.59]){
 const cover=part(new THREE.BoxGeometry(.39,.045,.39),black,1.77,1.075,z);
 headCovers.push(cover);
 part(new THREE.BoxGeometry(.32,.018,.31),paintMat,1.77,1.103,z);
}

// Cabina: parabrisas, techo y luneta inclinados
const cabinShape=new THREE.Shape();
cabinShape.moveTo(-.91,1.08);
cabinShape.lineTo(-.77,1.43);
cabinShape.lineTo(-.46,1.57);
cabinShape.lineTo(.30,1.57);
cabinShape.lineTo(.60,1.12);
cabinShape.closePath();
const cabinGeo=new THREE.ExtrudeGeometry(cabinShape,{
 depth:1.40,bevelEnabled:true,bevelSegments:2,
 bevelSize:.018,bevelThickness:.02
});
cabinGeo.translate(0,0,-.70);
part(cabinGeo,glass,0,0,0);

// Techo exterior
part(new THREE.BoxGeometry(.68,.065,1.43),paintMat,-.12,1.61,0);

// Ventanas laterales triangulares oscuras
for(const z of [-.715,.715]){
 const winShape=new THREE.Shape();
 winShape.moveTo(-.77,1.18);
 winShape.lineTo(-.65,1.43);
 winShape.lineTo(-.42,1.52);
 winShape.lineTo(.23,1.52);
 winShape.lineTo(.47,1.18);
 winShape.closePath();
 const w=new THREE.Mesh(new THREE.ShapeGeometry(winShape),glass);
 w.position.z=z;
 car.add(w);
}

// Marcos de ventanas
for(const z of [-.73,.73]){
 part(new THREE.BoxGeometry(.035,.42,.025),black,-.05,1.34,z);
 part(new THREE.BoxGeometry(.025,.04,.03),chrome,-.45,1.55,z);
}

// Espejos retrovisores
for(const z of [-.88,.88]){
 part(new THREE.BoxGeometry(.18,.10,.12),black,.52,1.04,z);
}

// Ruedas
const tires=[];
for(const x of [-1.30,1.30]){
 for(const z of [-.94,.94]){
  const tire=part(new THREE.CylinderGeometry(.39,.39,.24,40),black,x,.45,z);
  tire.rotation.x=Math.PI/2;
  tires.push(tire);

  const rim=part(new THREE.CylinderGeometry(.285,.285,.255,16),chrome,x,.45,z*1.01);
  rim.rotation.x=Math.PI/2;

  const inner=part(new THREE.CylinderGeometry(.22,.22,.265,16),black,x,.45,z*1.015);
  inner.rotation.x=Math.PI/2;

  const hub=part(new THREE.CylinderGeometry(.075,.075,.28,20),chrome,x,.45,z*1.02);
  hub.rotation.x=Math.PI/2;

  for(let i=0;i<8;i++){
   const a=i*Math.PI/4;
   const spoke=part(new THREE.BoxGeometry(.045,.30,.035),chrome,x,.45,z*1.02);
   spoke.rotation.set(a,0,Math.PI/2);
  }
 }
}

// Faldones laterales
for(const z of [-.86,.86]){
 part(new THREE.BoxGeometry(2.65,.09,.12),black,0,.39,z);
}

// Luces traseras rojas y banda posterior
part(new THREE.BoxGeometry(.12,.17,1.66),black,-2.08,.78,0);
for(const z of [-.57,-.30,.30,.57]){
 part(new THREE.BoxGeometry(.035,.10,.19),tailMat,-2.15,.81,z);
}

// Alerón trasero clásico
const spoiler=new THREE.Group();
car.add(spoiler);
part(new THREE.BoxGeometry(.07,.24,.10),black,-1.78,1.05,-.63,spoiler);
part(new THREE.BoxGeometry(.07,.24,.10),black,-1.78,1.05,.63,spoiler);
part(new THREE.BoxGeometry(.47,.07,1.58),black,-1.86,1.19,0,spoiler);

// Escape
part(new THREE.CylinderGeometry(.075,.075,.22,20),chrome,-1.85,.42,-.69)
 .rotation.x=Math.PI/2;

// Luces delanteras auxiliares
const frontLights=[];
for(const z of [-.70,.70]){
 const l=part(new THREE.BoxGeometry(.04,.075,.27),headMat,2.145,.58,z);
 frontLights.push(l);
}

// Luces que iluminan el suelo al activarse
const lamp1=new THREE.SpotLight(0xffffff,0,12,Math.PI/5,.5,1.5);
lamp1.position.set(2,.8,.55);
lamp1.target.position.set(5,0,.55);
scene.add(lamp1,lamp1.target);

const lamp2=new THREE.SpotLight(0xffffff,0,12,Math.PI/5,.5,1.5);
lamp2.position.set(2,.8,-.55);
lamp2.target.position.set(5,0,-.55);
scene.add(lamp2,lamp2.target);

let spin=false,lights=false,spoilerOn=true,brightness=1.3;

window.paint=function(c){
 paintMat.color.set(c);
 document.querySelector('#status').textContent='● COLOR ACTUALIZADO';
};

window.toggleLights=function(){
 lights=!lights;
 headMat.emissiveIntensity=lights?3:0;
 lamp1.intensity=lights?18:0;
 lamp2.intensity=lights?18:0;
 document.querySelector('#status').textContent=
 lights?'● FAROS ENCENDIDOS':'● FAROS APAGADOS';
};

window.toggleSpin=function(){
 spin=!spin;
 document.querySelector('#status').textContent=
 spin?'● GIRO AUTOMÁTICO ACTIVO':'● GIRO AUTOMÁTICO DETENIDO';
};

window.toggleSpoiler=function(){
 spoilerOn=!spoilerOn;
 spoiler.visible=spoilerOn;
};

window.toggleFloor=function(){
 floorMat.roughness=floorMat.roughness<.3?.75:.18;
 floorMat.metalness=floorMat.roughness<.3?.95:.2;
};

window.resetView=function(){
 camera.position.set(6,3.4,7);
 controls.target.set(0,.8,0);
 car.rotation.y=0;
 controls.update();
};

window.rearView=function(){
 camera.position.set(-6,2.8,-6);
 controls.target.set(0,.8,0);
 controls.update();
};

window.setBrightness=function(v){
 brightness=Number(v);
 renderer.toneMappingExposure=brightness;
 key.intensity=2.5*brightness;
};

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=clock.getDelta();
 if(spin)car.rotation.y+=dt*.35;
 controls.update();
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
